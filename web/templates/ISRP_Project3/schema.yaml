
id: https://example.org/isrp-project3
name: ISRP_Project3
version: 0.1.0
description: >-
  DataHarmonizer schema generated from ISRP Project 3 data dictionary with
  batch/sample metadata and 209 PCB congener columns (wide form).
prefixes:
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
default_curi_maps:
  - semweb_context
default_prefix: isrp3
imports:
  - linkml:types

types:
  WhitespaceMinimizedString:
    name: WhitespaceMinimizedString
    typeof: string
    base: str
    uri: xsd:token
    description: >-
      A string that has all whitespace trimmed off of beginning and end,
      and internal whitespace collapsed to single spaces.

