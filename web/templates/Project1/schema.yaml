slots:
  subject_id:
    name: subject_id
    title: Subject ID
    description: Unique identifier assigned to each subject within a study.
    range: WhitespaceMinimizedString
    required: true

  subject_species:
    name: subject_species
    title: Subject Species
    description: Biological species of the subject.
    range: WhitespaceMinimizedString
    required: true

  subject_strain:
    name: subject_strain
    title: Subject Strain
    description: Specific strain, breed, or population subgroup of the subject.
    range: WhitespaceMinimizedString
    required: false

  subject_genotype:
    name: subject_genotype
    title: Subject Genotype
    description: Genetic makeup or relevant genetic modification status of the subject.
    range: WhitespaceMinimizedString
    required: false

  subject_sex:
    name: subject_sex
    title: Subject Sex
    description: Biological sex of the subject.
    range: SubjectSexMenu
    required: true

  subject_age:
    name: subject_age
    title: Subject Age
    description: Age of the subject at time of measurement or study event in days.
    range: float
    required: true
    minimum_value: 0

  subject_weight:
    name: subject_weight
    title: Subject Weight
    description: Body weight of the subject at time of measurement or study event in grams.
    range: float
    required: true
    minimum_value: 0

  acclimation_period:
    name: acclimation_period
    title: Acclimation Period
    description: Time allowed to acclimate before experiment in days.
    range: float
    required: false
    minimum_value: 0

  euthanasia_method:
    name: euthanasia_method
    title: Euthanasia Method
    description: Method of euthanasia. 
    range: WhitespaceMinimizedString
    required: false

  light_cycle:
    name: light_cycle
    title: Light Cycle
    description: Light/dark cycle used throughout experiment. 
    range: WhitespaceMinimizedString
    required: false

  cage_density:
    name: cage_density
    title: Cage Density
    description: How many experimental animals per cage. 
    range: integer
    required: false

  cage_material:
    name: cage_material
    title: Cage Material
    description: Material of housing cage. 
    range: WhitespaceMinimizedString
    required: false

  cage_temperature:
    name: cage_temperature
    title: Cage Temperature
    description: Temperature of housing cage in degrees Celcius. 
    range: float
    required: false
    minimum_value: 0

  diet_composition:
    name: diet_composition
    title: Diet Composition
    description: Nutritional composition of diet.  
    range: WhitespaceMinimizedString
    required: false

  subject_litter_number:
    name: subject_litter_number
    title: Subject Litter Number
    description: Litter number of subject. 
    range: integer
    required: false

  subject_cohort_number:
    name: subject_cohort_number
    title: Subject Cohort Number
    description: Cohort number of subject.
    range: integer
    required: false

  sample_id:
    name: sample_id
    title: Sample ID
    description: Unique identifier assigned to the sample.
    range: WhitespaceMinimizedString
    required: true

  sample_class:
    name: sample_class
    title: Sample Class
    description: Type or class of sample collected.
    range: WhitespaceMinimizedString
    required: true

  sample_tissue_class:
    name: sample_tissue_class
    title: Sample Tissue Class
    description: Type of tissue or organ that was collected. 
    range: WhitespaceMinimizedString
    required: false

  sample_tissue_section_class:
    name: sample_tissue_section_class
    title: Sample Tissue Section Class
    description: Specific region/part of the tissue or organ that was collected.
    range: WhitespaceMinimizedString
    required: false

  sample_preservation_method:
    name: sample_preservation_method
    title: Sample Preservation Method
    description: How sample was preserved following necropsy.
    range: WhitespaceMinimizedString
    required: false

  sample_storage_temperature:
    name: sample_storage_temperature
    title: Sample Storage Temperature
    description: Temperature at which samples were stored before analysis in degrees Celcius.
    range: float
    required: false

  sampling_period:
    name: sampling_period
    title: Sampling Period
    description: Period over which samples were collected in days.
    range: float
    required: false
    minimum_value: 0

  sample_replicate_id:
    name: sample_replicate_id
    title: Sample Replicate ID
    description: Identifier of repeated measurements or repeated experimental observations for the same sample.
    range: integer
    required: false
    minimum_value: 0

  sample_mass:
    name: sample_mass
    title: Sample Mass
    description: Mass of sample collected in grams.
    range: float
    required: false
    minimum_value: 0

  sample_volume:
    name: sample_volume
    title: Sample Volume
    description: Volume of sample collected (if liquid) in mL.
    range: float
    required: false
    minimum_value: 0

  biological_replicate_id:
    name: biological_replicate_id
    title: Biological Replicate ID
    description: Identifier of independent biological replicate experiments.
    range: integer
    required: false
    minimum_value: 0

  technical_replicate_id:
    name: technical_replicate_id
    title: Technical Replicate ID
    description: Identifier of repeated measurements from the same biological replicate.
    range: integer
    required: false
    minimum_value: 0

  chemical_entity:
    name: chemical_entity
    title: Chemical Entity
    description: Name of the chemical, compound, or substance involved in the study.
    range: WhitespaceMinimizedString
    required: false

  chemical_entity_id:
    name: chemical_entity_id
    title: Chemical Entity ID
    description: Unique identifier for the chemical from a reference database or ontology
    range: WhitespaceMinimizedString
    required: false

  chemical_source:
    name: chemical_source
    title: Chemical Source
    description: Origin or supplier of the chemical substance
    range: WhitespaceMinimizedString
    required: false

  dose_value:
    name: dose_value
    title: Dose Value
    description: Amount of chemical administered or measured exposure level.
    range: WhitespaceMinimizedString
    required: false
    minimum_value: 0

  exposure_route:
    name: exposure_route
    title: Exposure Route
    description: Pathway through which the subject was exposed to the chemical.
    range: ExposureRouteMenu
    required: false

  exposure_start_time:
    name: exposure_start_time
    title: Exposure Start Time
    description: Start day of exposure.
    range: date
    required: false

  exposure_end_time:
    name: exposure_end_time
    title: Exposure End Time
    description: End day of exposure.
    range: date
    required: false

  exposure_start_age:
    name: exposure_start_age
    title: Exposure Start Age
    description: Age of subject at initial exposure in days.
    range: float
    required: false
    minimum_value: 0

  exposure_end_age:
    name: exposure_end_age
    title: Exposure End Age
    description: Age of subject at final exposure in days.
    range: float
    required: false
    minimum_value: 0

  exposure_duration:
    name: exposure_duration
    title: Exposure Duration
    description: Length of time over which exposure occurred in days.
    range: float
    required: false
    minimum_value: 0

  exposure_frequency:
    name: exposure_frequency
    title: Exposure Frequency
    description: Frequency of when subject was exposed.
    range: ExposureFrequencyMenu
    required: false

  exposure_vehicle:
    name: exposure_vehicle
    title: Exposure Vehicle
    description: Medium or substance used to deliver the chemical.
    range: WhitespaceMinimizedString
    required: false

  exposure_group:
    name: exposure_group
    title: Exposure Group
    description: Group assigned for exposure (control, low, high, etc).
    range: WhitespaceMinimizedString
    required: false

  assay_name:
    name: assay_name
    title: Assay Name
    description: Name or label of the assay used to generate the data.
    range: WhitespaceMinimizedString
    required: false

  assay_type:
    name: assay_type
    title: Assay Type
    description: General category or classification of the assay.
    range: AssayTypeMenu
    required: false

  assay_run_id:
    name: assay_run_id
    title: Assay Run ID
    description: Unique identifier for a specific execution/run of an assay.
    range: WhitespaceMinimizedString
    required: false

  analysis_method:
    name: analysis_method
    title: Analysis Method
    description: Computational or analytical method used to process or interpret data.
    range: WhitespaceMinimizedString
    required: false

  reference_standard:
    name: reference_standard
    title: Reference Standard
    description: Known standard used for calibration or comparison in the assay
    range: WhitespaceMinimizedString
    required: false

  instrument_name:
    name: instrument_name
    title: Instrument Name
    description: Name/model of the instrument used to perform the assay.
    range: WhitespaceMinimizedString
    required: false

  experiment_batch:
    name: experiment_batch
    title: Experiment Batch
    description: Identifier grouping samples processed together under similar conditions.
    range: WhitespaceMinimizedString
    required: false

  experiment_type:
    name: experiment_type
    title: Experiment Type
    description: Overall design or purpose of the study.
    range: ExperimentTypeMenu
    required: false

  software:
    name: software
    title: Software
    description: Software used for analysis.
    range: WhitespaceMinimizedString
    required: false

  software_version:
    name: software_version
    title: Software Version
    description: Software version used for analysis. 
    range: WhitespaceMinimizedString
    required: false

  limit_of_detection:
    name: limit_of_detection
    title: Limit of Detection
    description: Lowest concentration or amount that can be reliably distinguished from noise.
    range: float
    required: false
    minimum_value: 0

  limit_of_quantification:
    name: limit_of_quantification
    title: Limit of Quantification
    description: Lowest concentration or amount that can be quantitatively measured with acceptable precision.
    range: float
    required: false
    minimum_value: 0

  quality_flag:
    name: quality_flag
    title: Quality Flag
    description: Indicator of data quality or usability for a given observation.
    range: QualityFlagMenu
    required: false

  reference_material:
    name: reference_material
    title: Reference Material
    description: Material with known properties used to validate or benchmark assay performance.
    range: WhitespaceMinimizedString
    required: false

  spike_recovery:
    name: spike_recovery
    title: Spike Recovery
    description: Recovery percentage of spiked sample.
    range: float
    required: false
    minimum_value: 0

  qc_batch_id:
    name: qc_batch_id
    title: Quality Control Batch ID
    description: Batch identifier for quality control. 
    range: WhitespaceMinimizedString
    required: false

