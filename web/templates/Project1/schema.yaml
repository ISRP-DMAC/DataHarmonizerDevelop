
id: https://example.org/Project1
name: Project1
version: 0.1.0
description: >-
  DataHarmonizer schema generated from ISRP Project 1 data dictionary with
  batch/sample metadata and 209 PCB congener columns (wide form).
prefixes:
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
default_curi_maps:
  - semweb_context
default_prefix: isrp1
imports:
  - linkml:types

types:
  WhitespaceMinimizedString:
    name: WhitespaceMinimizedString
    typeof: string
    base: str
    uri: xsd:token
    description: >-
      A string that has all whitespace trimmed off of beginning and end,
      and internal whitespace collapsed to single spaces.

classes:
  dh_interface:
    name: dh_interface
    description: A DataHarmonizer interface (sheet)

