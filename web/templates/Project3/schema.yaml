  Jason_sampleType:
    name: Jason_sampleType
    title: sampleType
    description: Location and material descriptions for each sample.
    is_a: dh_interface
    see_also:
    annotations:
      version: 1.0.0
    slots:
      - sample_id
      - sample_type
      - room_id
      - materials
      - school_id
      - sampling_round
      - remediation
      - sampling_start_date
      - sampling_end_date
      - remediation_method
    slot_usage:
      sample_id:
        name: sample_id
        rank: 1
        slot_group: Sampling Metadata
      sample_type:
        name: sample_type
        rank: 2
        slot_group: Sampling Metadata
      room_id:
        name: room_id
        rank: 3
        slot_group: Sampling Metadata
      materials:
        name: materials
        rank: 4
        slot_group: Sampling Metadata
      school_id:
        name: school_id
        rank: 5
        slot_group: Sampling Metadata
      sampling_round:
        name: sampling_round
        rank: 6
        slot_group: Sampling Metadata
      remediation:
        name: remediation
        rank: 7
        slot_group: Sampling Metadata
      sampling_start_date:
        name: sampling_start_date
        rank: 8
        slot_group: Sampling Metadata
      sampling_end_date:
        name: sampling_end_date
        rank: 9
        slot_group: Sampling Metadata
      remediation_method:
        name: remediation_method
        rank: 10
        slot_group: Sampling Metadata
slots:
  sample_id:
    name: sample_id
    title: sample_id
    range: WhitespaceMinimizedString
    required: true
    description: Unique sample ID
    identifier: true
    comments:
      - Unique identifier assigned to each sampler prior to deployment. The ID should remain unchanged throughout sample collection and analysis.
    examples:
      - value: S324
      - value: S647
      - value: S669
  sample_type:
    name: sample_type
    title: sample_type
    range: sample_ type_option
    required: true
    description: Type of sampler deployed
    comments:
      - Indicates the type of sampler used for sample collection. Values should correspond to the predefined sampler categories.
    examples:
      - value: emissions
      - value: air, field blank
  room_id:
    name: room_id
    title: room_id
    range: WhitespaceMinimizedString
    required: true
    description: Room ID assigned in the field
    comments:
      - Identifier used to designate the room or location where the sampler was deployed. Should match the room naming convention used for the site.
    examples:
      - value: '260'
      - value: Mezzanine
      - value: Gym
  materials:
    name: materials
    title: materials
    range: WhitespaceMinimizedString
    required: true
    description: Specific material, surface, matrix etc. that was sampled
    comments:
      - Describes the material, surface, or matrix from which the sample was collected. Use consistent terminology across samples.
    examples:
      - value: Fireproof Coating
      - value: Mastic
      - value: Steel Beam
  school_id:
    name: school_id
    title: school_id
    range: WhitespaceMinimizedString
    required: true
    description: Unqiue school ID
    comments:
      - Identifier assigned to each school or building included in the study. Should be consistent across all sampling rounds.
    examples:
      - value: SCH A
      - value: SCH O
      - value: SCH K
  sampling_round:
    name: sampling_round
    title: sampling_round
    range: integer
    required: true
    description: The sampling round associated with each sample for a school
    comments:
      - Indicates the sampling event or campaign sequence for the school. Used to distinguish repeated measurements collected over time.
    examples:
      - value: '1'
      - value: '2'
      - value: '3'
  remediation:
    name: remediation
    title: remediation
    range: remediation_option
    required: true
    description: Indicates if the sampler was deployed before or after remediation was performed on the material
    comments:
      - Specifies whether sample collection occurred before or after remediation activities associated with the sampled material.
    examples:
      - value: Before
      - value: After
      - value: Interim
  sampling_start_date:
    name: sampling_start_date
    title: sampling_start_date
    any_of:
      - range: date
      - range: null_value_option
    required: true
    description: Sampler deployment start date
    comments:
      - Date on which the sampler was deployed in the field. Represents the beginning of the sampling period.
    examples:
      - value: '2023-12-09'
      - value: '2024-12-06'
  sampling_end_date:
    name: sampling_end_date
    title: sampling_end_date
    any_of:
      - range: date
      - range: null_value_option
    required: true
    description: Sampler deployment collection/end date
    comments:
      - Date on which the sampler was retrieved or sampling was completed. Represents the end of the sampling period.
    examples:
      - value: '2024-07-17'
      - value: '2025-07-16'
  remediation_method:
    name: remediation_method
    title: remediation_method
    any_of:
      - range: WhitespaceMinimizedString
      - range: null_value_option
    required: true
    description: Describes how the material was remediated
    comments:
      - Describes the remediation approach or treatment applied to the sampled material prior to or following sampling. Use standardized terminology when possible.
    examples:
      - value: srcRmEncap
      - value: surfaceRm
      - value: renovated
  tPCB:
    name: tPCB
    title: tPCB
    any_of:
      - range: null_value_option
      - range: float
    required: true
    description: total PCBs, sum of all 209 PCB congeners
    minimum_value: 0
    comments:
      - Total PCB concentration calculated as the sum of all measured PCB congeners. Values should be reported using the units specified for the study.
  PCB1:
    name: PCB1
    title: PCB1
    any_of:
      - range: null_value_option
      - range: float
    required: true
    description: Concentration or mass measurement for PCB congener 1.
    minimum_value: 0
    comments:
      - 'Numeric value expected.       Special values:       NA = missing value.       ND = below the limit of quantification (LOQ).'
    examples:
