enums:
  sample_type_option:
    name: sample_type_option
    title: sample type option
    permissible_values:
      emission:
        text: emission
        title: emission
        description: Indicates the type of sampler used for sample collection.
      air:
        text: air
        title: air
        description: Indicates the type of sampler used for sample collection.
      lab blank:
        text: lab blank
        title: lab blank
        description: Indicates the type of sampler used for sample collection.
      field blank:
        text: field blank
        title: field blank
        description: Indicates the type of sampler used for sample collection.
  remediation_option:
    name: remediation_option
    title: remediation option
    permissible_values:
      before:
        text: before
        title: before
        description: Indicates if the sampler was deployed before or after remediation was performed on the material
      after:
        text: after
        title: after
        description: Indicates if the sampler was deployed before or after remediation was performed on the material
      interim:
        text: interim
        title: interim
        description: Indicates if the sampler was deployed before or after remediation was performed on the material
  null_value_option:
    name: null_value_option
    title: null value option
    permissible_values:
      NA:
        text: NA
        title: NA
        description: missing value
      ND:
        text: ND
        title: ND
        description: limit of quantification
types:
  WhitespaceMinimizedString:
    name: WhitespaceMinimizedString
    typeof: string
    description: 'A string that has all whitespace trimmed off of beginning and end, and all internal whitespace segments reduced to single spaces. Whitespace includes #x9 (tab), #xA (linefeed), and #xD (carriage return).'
    base: str
    uri: xsd:token
  Provenance:
    name: Provenance
    typeof: string
    description: A field containing a DataHarmonizer versioning marker. It is issued by DataHarmonizer when validation is applied to a given row of data.
    base: str
    uri: xsd:token
settings:
  Title_Case: (((?<=\b)[^a-z\W]\w*?|[\W])+)
  UPPER_CASE: '[A-Z\W\d_]*'
  lower_case: '[a-z\W\d_]*'
