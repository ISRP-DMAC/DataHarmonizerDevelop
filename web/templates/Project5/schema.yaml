  location:
    name: location
    title: location
    description: >-
      Sampling location identifier associated with the environmental sample.
      Example locations include INT_218, INT_222, WS229, and WS229.
      Location of collection of sediment samples from New Bedford Harbor.
    range: LocationMenu
    required: true

  latitude:
    name: latitude
    title: latitude
    description: >-
      Latitude coordinate of the sampling location in degrees, minutes,
      and seconds format.
    range: LatitudeMenu
    required: true

  longitude:
    name: longitude
    title: longitude
    description: >-
      Longitude coordinate of the sampling location in degrees, minutes,
      and seconds format.
    range: LongitudeMenu
    required: true

