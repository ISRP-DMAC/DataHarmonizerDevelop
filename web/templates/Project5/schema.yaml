  David_09_RT-qPCR_data:
    name: David_09_RT-qPCR_data
    description: RT-qPCR measurements and associated sample metadata
    is_a: dh_interface
    tree_root: false
    slots:
      - sample_id
      - experimental_replicate
      - technical_replicate
      - experiment
      - percent_biochar
      - time
      - group
      - units
      - DNA
      - cDNA

    slot_usage:
      sample_id:
        rank: 1
        slot_group: Sample Metadata

      experimental_replicate:
        rank: 2
        slot_group: Sample Metadata

      technical_replicate:
        rank: 3
        slot_group: Sample Metadata

      experiment:
        rank: 4
        slot_group: Sample Metadata

      percent_biochar:
        rank: 5
        slot_group: Sample Metadata

      time:
        rank: 6
        slot_group: Sample Metadata

      group:
        rank: 7
        slot_group: Sample Metadata

      units:
        rank: 8
        slot_group: Sample Metadata

      DNA:
        rank: 9
        slot_group: qPCR Measurements

      cDNA:
        rank: 10
        slot_group: qPCR Measurements


slots:
  sample_id:
    name: sample_id
    title: sample ID
    description: >-
      Unique identifier for each sample.
    range: WhitespaceMinimizedString
    identifier: true
    required: true
    comments: unique identifier
    examples:
      - value: d0_1
      - value: d11_BC_1
      - value: d11_ctrl
  
  sample_medium:
    name: sample_medium
    title: sample medium
    description: >-
      Type of sampling medium used for sample collection.
    comments: Type of passive sampler used to collect airborne or aqueous PCBs from microcosms.
    range: Sample medium option
    required: true
    examples:
      - value: PUF
      - value: SPME
  
  units:
    name: units
    title: units
    description: >-
      Measurement units associated with the sample result.
    range: Units option
    required: true
    comments: specify the measurement unit
    examples:
      - value: ng/PUF
      - value: ng/cm
      - value: copies/g biochar
      - value: copies/g sediment

  experiment:
    name: experiment
    title: experiment
    description: >-
      Experiment category or experiment name associated with the sample. 
