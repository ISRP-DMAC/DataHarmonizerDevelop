
id: https://example.org/Project5
name: Project5
version: 0.1.0
description: >-
  DataHarmonizer schema generated from ISRP Project 5 dictionary covering
  multiple PCB datasets. Supports long-form rows with one congener per row.
prefixes:
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
default_curi_maps:
  - semweb_context
default_prefix: project5
imports:
  - linkml:types

types:
  WhitespaceMinimizedString:
    name: WhitespaceMinimizedString
    typeof: string
    base: str
    uri: xsd:token
    description: >-
      A string that has all whitespace trimmed off of beginning and end,
      and internal whitespace collapsed to single spaces.

