  David_09_RT-qPCR_data:
    name: David_09_RT-qPCR_data
    description: One row per sample (and congener if long-form)
    is_a: dh_interface
    tree_root: true
    slots:
      - sample_id
      - experimental_replicate
      - technical_replicate
      - experiment
      - percent_biochar
      - time
      - group
      - units
      - DNA
      - cDNA
    unique_keys:
      sample_key:
        unique_key_name: sample_key
        unique_key_slots: [sample_id]

slots:
  sample_id:
    name: sample_id
    title: sample_id
    description: >-
      Unique identifier for each sample.
    range: SampleIDMenu
    required: true
  
  sample_medium:
    name: sample_medium
    title: sample_medium
    description: >-
      Type of sampling medium used for sample collection.
      Options include PUF and SPME.
      Type of passive sampler used to collect airborne or aqueous PCBs from microcosms.
    range: SampleMediumMenu
    required: false
  
  units:
    name: units
    title: units
    description: >-
      Measurement units associated with the sample result.
      Options include ng/PUF and ng/cm.
    range: UnitsMenu
    required: false

  experiment:
    name: experiment
    title: experiment
    description: >-
      Experiment category or experiment name associated with the sample. 
      Denotes which experiment each sample belongs to; Altavista Shaken (AVL_S), Altavista Non-Shaken (AVL_NS), or New Bedford Non-Shaken (NBH_NS)
    range: ExperimentMenu
    required: false

  percent_biochar:
    name: percent_biochar
    title: percent_biochar
    description: >-
      Percentage of biochar used in the experiment. 
      Example values include 0, 1.5, 5, and 10.
      Percentage of biochar added to sediment microcosms by weight (10 g sediment)
    range: PercentBiocharMenu
    required: false

  time:
    name: time
    title: time
    description: >-
      Experiment duration or sampling time.
      Example value shown is 90.
    range: TimeMenu
    required: false

  group:
    name: group
    title: group
    description: >-
      Experimental treatment group associated with the sample.
      Describes whether a sample is a control without addition of P. xenovorans LB400 biofilms on biochar or a treatment with LB400 added
    range: GroupMenu
    required: false
  
  replicate:
    name: replicate
    title: replicate
    description: Denotes which replicate belongs to each sample (1 to 4)
    range: ReplicateMenu
    required: false


  tPCB:
    name: tPCB
    title: tPCB
    description: Total PCBs, sum of all 209 PCB congeners
    any_of:
      - range: NullValueMenu
      - range: float
    required: false
    minimum_value: 0
    annotations:
      unit:
        tag: unit
        value: ng | ng/PUF | ng/cm SPME | ng/g dry

  LCPCB:
    name: LCPCB
    title: LCPCB
    description: Sum of mono-, di-, and tri-chlorinated congeners (1..39)
    any_of:
      - range: NullValueMenu
      - range: float
    required: false
    minimum_value: 0
    annotations:
      unit:
        tag: unit
        value: ng | ng/PUF | ng/cm SPME | ng/g dry

  blank_id:
    name: blank_id
    title: blank sample id
    description: >-
      Sample number for each blank used to calculate LOQ (B1..B22). 
      Provides the sample number for each blank sample used to calculate the limit of quantification.
    range: BlankMenu
    required: false

  PCB1:
    name: PCB1
    title: "PCB1"
    description: pcb congener 1
    any_of:
      - range: NullValueMenu
      - range: float
    required: false
    minimum_value: 0

  PCB2:
    name: PCB2
    title: "PCB2"
    description: pcb congener 2
    any_of:
      - range: NullValueMenu
      - range: float
    required: false
    minimum_value: 0

  PCB3:
    name: PCB3
    title: "PCB3"
    description: pcb congener 3
    any_of:
      - range: NullValueMenu
      - range: float
    required: false
    minimum_value: 0

  PCB4:
    name: PCB4
    title: "PCB4"
    description: pcb congener 4
    any_of:
      - range: NullValueMenu
      - range: float
    required: false
    minimum_value: 0

  PCB5:
    name: PCB5
    title: "PCB5"
    description: pcb congener 5
    any_of:
      - range: NullValueMenu
      - range: float
    required: false
    minimum_value: 0

  PCB6:
    name: PCB6
    title: "PCB6"
    description: pcb congener 6
    any_of:
      - range: NullValueMenu
      - range: float
    required: false
    minimum_value: 0

  PCB7:
