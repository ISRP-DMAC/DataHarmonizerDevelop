# Enumerations
enums:

  Sample medium option:
    name: Sample medium option
    title: sample medium option
    permissible_values:
      PUF: {}
      SPME: {}

  Units option:
    title: unit option
    permissible_values:
      ng per PUF : 
         text: ng per PUF
         title: ng/PUF
         description: nanograms of PCB measured per polyurethane foam (PUF) passive sampler.   
      ng per cm:
          text: ng per cm
          title: ng/cm
          description: nanograms of PCB measured per centimeter of SPME fiber.
          comments: 
      copies per gram biochar:
          text: copies per gram biochar
          title: copies/g biochar
          description: quantitative PCR measurement expressed as gene copies per gram of biochar.
      copies per gram sediment: 
          text: copies per gram sediment
          title: copies/g sediment
          description: quantitative PCR measurement expressed as gene copies per gram of sediment.
  

  Experiment option:
    name: Experiment option
    title: experiment option
    permissible_values:
      biochar_percentage: {}
      biochar_timeseries: {}



  Group option:
    name: Group option
    title: group option
    description: Treatment group
    permissible_values:
      control: {}
      treatment: {}

  Replicate option:
    name: Replicate option
    title: replicate option
    description: Replicate numbers 1..4
    permissible_values:
      "1": {}
      "2": {}
      "3": {}
      "4": {}

  NullValueMenu:
    name: NullValueMenu
    title: null value 
    permissible_values:
       missing value:
        text: missing value
        title: NA
        description: missing value
       limit of quantification:
        text: limit of quantification
        title: ND
        description: limit of quantification

  Experimental replicate option:
    name: Experimental replicate option
    title: experimental replicate option
    description: Experimental replicate numbers
    permissible_values:
      "1": {}
      "2": {}
      "3": {}

  Technical replicate option:
    name: Technical replicate option
    title: technical replicate option
    description: Technical replicate numbers
    permissible_values:
      "1": {}
      "2": {}


