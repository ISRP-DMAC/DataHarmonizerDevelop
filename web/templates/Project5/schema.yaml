  location:
    name: location
    title: location
    description: >-
      Sampling location identifier associated with the environmental sample.
    comments: >-
      Location of collection of sediment samples from New Bedford Harbor.
    examples:
      - value: INT_218
      - value: INT_222
      - value: WS229
    range: string
    required: true

  latitude:
    name: latitude
    title: latitude
    description: >-
      Latitude coordinate of the sampling location in degrees, minutes,and seconds format.
    comments: >-
      Latitude of the sediment sampling location.
    examples:
      - value: 41°40'15"N
      - value: 41°40'12"N
      - value: 41°40'17"N
    range: string
    required: true

  longitude:
    name: longitude
    title: longitude
    description: >-
      Longitude coordinate of the sampling location in degrees, minutes,and seconds format.
    comments: >-
      Longitude of the sediment sampling location.
    examples:
      - value: 70°55'08"W
      - value: 70°55'09"W
      - value: 70°55'04"W
    range: string
    required: true

  experimental_replicate:
    name: experimental_replicate
    title: experimental replicate
    description: Denotes which experimental replicate belongs to each sample.
    comments: >-
      Denotes the biological or experimental replicate.
    examples:
      - value: "1"
      - value: "2"
      - value: "3"
    range: Experimental replicate option
    required: true

  technical_replicate:
    name: technical_replicate
    title: technical replicate
    description: >-
