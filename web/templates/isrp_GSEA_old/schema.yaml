id: https://example.org/isrp/gsea
name: ISRP_GSEA
description: 'Field names and description are from GSEA User Guide (https://docs.gsea-msigdb.org/#GSEA/GSEA_User_Guide/#interpreting-gsea-results)'
version: 0.2.0
imports:
- linkml:types
prefixes:
  GO: http://purl.obolibrary.org/obo/GO
  GENEPIO: http://purl.obolibrary.org/obo/GENEPIO
  linkml: "https://w3id.org/linkml/"
  nmdc: "https://w3id.org/nmdc/"
  kegg: "https://www.kegg.jp/entry/"
  schema: http://schema.org/
  this: https://example.org/marbles/kegg/enrichment/
default_prefix: this
default_range: string
classes:
  dh_interface:
    name: dh_interface
    description: DataHarmonizer interface for KEGG enrichment results
  ISRP_GSEA:
    name: ISRP_GSEA
    description: 'Iowa Research Online version'
    is_a: dh_interface
    see_also: templates/canada_covid19/SOP.pdf
    slots:
    - GS
    - description
    - size
    - ES
    - NES
    - p_value
    - FWER_p_value
    - FDR_q_value
    - rank_at_max
    - leading_edge
    - core_enrichment
    - authors
    - dataharmonizer_provenance
    slot_usage:
      GS:
        rank: 1
        slot_group: Database Identifier
      description:
        rank: 2
        slot_group: Database Identifier
      size:
        rank: 3
        slot_group: GSEA Output
      ES:
        rank: 4
        slot_group: GSEA Output
      NES:
        rank: 5
        slot_group: GSEA Output
      p_value:
        rank: 6
        slot_group: GSEA Output
      FWER_p_value:
        rank: 7
        slot_group: GSEA Output
      FDR_q_value: 
        rank: 8
        slot_group: GSEA Output
      rank_at_max:
        rank: 9
        slot_group: GSEA Output
      leading_edge:
        rank: 10
        slot_group: GSEA Output
      core_enrichment:
        rank: 11
        slot_group: GSEA Output
      authors:
        rank: 12
        slot_group: Contributor Acknowledgement
      dataharmonizer_provenance:
        rank: 13
        slot_group: Contributor Acknowledgement
  ISRP_GSEA:
    name: ISRP_GSEA
    description: 'Iowa Research Online version'
    is_a: dh_interface
    see_also: templates/canada_covid19/SOP.pdf
    slots:
    - GS
    - description
    - size
    - ES
    - NES
    - p_value
    - FWER_p_value
    - FDR_q_value
    - rank_at_max
    - leading_edge
    - core_enrichment
    - authors
    - dataharmonizer_provenance
    slot_usage:
      GS:
        rank: 1
        slot_group: Database Identifier
      description:
        rank: 2
        slot_group: Database Identifier
      size:
        rank: 3
        slot_group: GSEA Output
      ES:
        rank: 4
        slot_group: GSEA Output
      NES:
        rank: 5
        slot_group: GSEA Output
      p_value:
        rank: 6
        slot_group: GSEA Output
      FWER_p_value:
        rank: 7
        slot_group: GSEA Output
      FDR_q_value: 
        rank: 8
        slot_group: GSEA Output
      rank_at_max:
        rank: 9
        slot_group: GSEA Output
      leading_edge:
        rank: 10
        slot_group: GSEA Output
      core_enrichment:
        rank: 11
        slot_group: GSEA Output
      authors:
        rank: 12
        slot_group: Contributor Acknowledgement
      dataharmonizer_provenance:
        rank: 13
        slot_group: Contributor Acknowledgement
slots:
  GS:
    name: GS
    title: GS
    description: Gene set name. E.g., any KEGG entry (pathway, gene, compound, disease, module, etc.)
    range: string
    pattern: "^[A-Za-z]{1,5}[:A-Za-z0-9_]*[0-9]{3,}$"
    required: true
    slot_uri: https://docs.gsea-msigdb.org/#GSEA/GSEA_User_Guide/
    examples:
    - value: hsa04930
      description: KEGG pathway ID (organism-specific)
    - value: map00010
      description: KEGG reference pathway ID
  description:
    name: description
    title: description
    description: Detailed description of the gene set
    range: string
    required: true
    slot_uri: schema:name
    examples:
    - value: Insulin signaling pathway
  size:
    name: size
    title: size
    description: Number of genes in the gene set after filtering out those genes not in the expression dataset.
    range: integer
    slot_uri: https://docs.gsea-msigdb.org/#GSEA/GSEA_User_Guide/
    required: true
    minimum_value: 1
    maximum_value: 1000
    examples:
    - value: 87
  ES:
    name: ES
    title: ES
    description: Enrichment score for the gene set; that is, the degree to which this gene set is overrepresented at the top or bottom of the ranked list of genes in the expression dataset.
    range: float
    slot_uri: https://docs.gsea-msigdb.org/#GSEA/GSEA_User_Guide/
    required: true
    minimum_value: -1.0
    maximum_value: 1.0
    examples:
    - value: 0.52
  NES:
    name: NES
    title: NES
    description: Normalized enrichment score; that is, the enrichment score for the gene set after it has been normalized across analyzed gene sets.
    range: float
    required: true
    slot_uri: https://docs.gsea-msigdb.org/#GSEA/GSEA_User_Guide/
    minimum_value: -5.0
    maximum_value: 5.0
    examples:
    - value: 1.9
  p_value:
    name: p_value
    title: p_value
    description: Nominal p value; that is, the statistical significance of the enrichment score. The nominal p value is not adjusted for gene set size or multiple hypothesis testing; therefore, it is of limited use in comparing gene sets.
    range: float
    required: true
    slot_uri: https://docs.gsea-msigdb.org/#GSEA/GSEA_User_Guide/
    minimum_value: 0.0
    maximum_value: 0.05
    exact_mappings:
    - EDAM:data_1669
    examples:
    - value: 0.003
  FWER_p_value:
    name: FWER_p_value
    title: FWER_p_value
    description: Familywise-error rate; that is, a more conservatively estimated probability that the normalized enrichment score represents a false positive finding. Because the goal of GSEA is to generate hypotheses, the GSEA team recommends focusing on the FDR statistic.
    range: float
    required: true
    slot_uri: https://docs.gsea-msigdb.org/#GSEA/GSEA_User_Guide/
    minimum_value: 0.0
    maximum_value: 0.05
    examples:
    - value: 0.012
  FDR_q_value:
    name: FDR_q_value
    title: FDR_q_value
    description: False discovery rate; that is, the estimated probability that the normalized enrichment score represents a false positive finding.
    range: float
    required: true
    slot_uri: https://docs.gsea-msigdb.org/#GSEA/GSEA_User_Guide/
    minimum_value: 0.0
    maximum_value: 0.1
    exact_mappings:
    - EDAM:data_3932
    examples:
    - value: 0.015
  rank_at_max:
    name: rank_at_max
    title: rank_at_max
    description: The position in the ranked list at which the maximum enrichment score occurred. The more interesting gene sets achieve the maximum enrichment score near the top or bottom of the ranked list; that is, the rank at max is either very small or very large.
    range: integer
    required: true
    slot_uri: https://docs.gsea-msigdb.org/#GSEA/GSEA_User_Guide/
    minimum_value: 1
    examples:
    - value: 7
    close_mappings:
    - SIO:000367
  leading_edge:
    name: leading_edge
    title: leading_edge
    description: Displays the three statistics used to define the leading edge subset. 
    range: string
    required: true
    slot_uri: https://docs.gsea-msigdb.org/#GSEA/GSEA_User_Guide/
    examples:
    - value: tags (80%), list (50%), signal (65%)
  core_enrichment:
    name: core_enrichment
    title: core_enrichment
    description: genes that are present in pathway. Not sure the mapping of this field. 
    range: string
    required: true
    examples:
    - value: AKT1; IRS1; PIK3CA; PDPK1; FOXO3
  authors:
    name: authors
    title: authors
    description: Names of individuals contributing to the processes of sample collection,
      sequence generation, analysis, and data submission.
    comments: Include the first and last names of all individuals that should be attributed,
      separated by a comma.
    slot_uri: GENEPIO:0001517
    recommended: true
    range: WhitespaceMinimizedString
    examples:
    - value: William Smith, Sandra Johnson
  dataharmonizer_provenance:
    name: dataharmonizer_provenance
    title: DataHarmonizer Provenance
    description: The DataHarmonizer software and template version provenance.
    comments: The current software and template version information will be automatically
      generated in this field after the user utilizes the "validate" function. This
      information will be generated regardless as to whether the row is valid of not.
    slot_uri: GENEPIO:0001518
    range: Provenance
    examples:
    - value: DataHarmonizer v1.4.3, KEGG_Enrichment v0.1.0
enums:
  NullValueMenu:
    name: NullValueMenu
    title: null value menu
    permissible_values:
      Not Applicable:
        text: Not Applicable
        meaning: GENEPIO:0001619
      Not Collected:
        text: Not Collected
        meaning: GENEPIO:0001620
      Not Provided:
        text: Not Provided
        meaning: GENEPIO:0001668
      Missing:
        text: Missing
        meaning: GENEPIO:0001618
      Restricted Access:
        text: Restricted Access
        meaning: GENEPIO:0001810
types:
  WhitespaceMinimizedString:
    name: WhitespaceMinimizedString
    typeof: string
    description: 'A string that has all whitespace trimmed off of beginning and end,
      and all internal whitespace segments reduced to single spaces. Whitespace includes
      #x9 (tab), #xA (linefeed), and #xD (carriage return).'
    base: str
    uri: xsd:token
  Provenance:
    name: Provenance
    typeof: string
    description: A field containing a DataHarmonizer versioning marker. It is issued
      by DataHarmonizer when validation is applied to a given row of data.
    base: str
    uri: xsd:token
settings:
  Title_Case: (((?<=\b)[^a-z\W]\w*?|[\W])+)
  UPPER_CASE: '[A-Z\W\d_]*'
  lower_case: '[a-z\W\d_]*'
